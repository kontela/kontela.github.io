<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My pitch to join fal — Erman Avsar</title>
  <meta name="description" content="My pitch to join fal, with a short video introduction and my CV.">
  <style>
    :root { color-scheme: light; --ink: #1f2933; --muted: #616e7c; --line: #d9e2ec; --link: #1265d8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.6; }
    main { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, summary:focus-visible { outline: 3px solid var(--link); outline-offset: 5px; }
    .back { display: inline-block; margin-bottom: 36px; font-size: 14px; color: var(--muted); }
    h1 { margin: 0 0 28px; font-size: clamp(28px, 4vw, 40px); line-height: 1.2; letter-spacing: -0.025em; }
    .video { width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; border: 0; border-radius: 14px; background: #f3f4f6; }
    .video-link { margin: 12px 0 36px; font-size: 14px; }
    details { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    summary { cursor: pointer; padding: 20px 4px; font-size: 18px; font-weight: 500; }
    .cv-content { padding: 0 4px 20px; }
    .cv-content p { margin: 0 0 16px; font-size: 14px; }
    .cv-preview { display: block; width: 100%; height: 78vh; min-height: 420px; border: 1px solid var(--line); border-radius: 8px; }
    @media (max-width: 600px) { main { padding: 28px 18px 56px; } .back { margin-bottom: 28px; } .video { border-radius: 10px; } .cv-preview { height: 65vh; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← Erman Reads</a>
    <h1>My pitch to join fal</h1>
    <iframe class="video" src="https://www.youtube-nocookie.com/embed/VJLXnJNCQsA?rel=0" title="My pitch to join fal — Erman Avsar" width="912" height="513" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <p class="video-link"><a href="https://youtu.be/VJLXnJNCQsA">Watch on YouTube ↗</a></p>
    <details>
      <summary>View my CV</summary>
      <div class="cv-content">
        <p><a href="Erman_Avsar_CV.pdf" target="_blank" rel="noopener">Open CV as PDF ↗</a> · <a href="Erman_Avsar_CV.pdf" download>Download CV</a></p>
        <iframe class="cv-preview" src="Erman_Avsar_CV.pdf" title="Erman Avsar’s CV" loading="lazy"></iframe>
      </div>
    </details>
  </main>
</body>
</html>
