<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erman Reads</title>
  <meta name="description" content="Things I like to read, dig into, and connect dots on over the weekend.">
  <style>
    :root {
      --ink: #1f2933;
      --muted: #616e7c;
      --line: #d9e2ec;
      --link: #1265d8;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    h1 {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .bio {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 14px;
      max-width: 480px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 48px;
    }

    .header-text { flex: 1; }

    .portrait {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      margin-left: 24px;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .projects {
      margin-bottom: 48px;
    }

    .project {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .project:first-child {
      border-top: 1px solid var(--line);
    }

    .project a {
      color: var(--ink);
      font-weight: 500;
      font-size: 15px;
    }

    .project span {
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      padding-top: 32px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .page { padding: 40px 18px 56px; }
      h1 { font-size: 34px; }
    }

    @media (max-width: 420px) {
      .portrait { width: 76px; height: 76px; margin-left: 16px; }
      h1 { font-size: 31px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="header">
      <div class="header-text">
        <h1>Erman Reads</h1>
        <p class="bio">I like history and books. Reading through archives with AI agents has made it 10× more enjoyable.</p>
      </div>
      <div class="portrait">
        <img src="profile_pic.jpg" alt="">
      </div>
    </div>

    <section class="projects">
      <h2>SpaceX</h2>
      <div class="project">
        <a href="/take-off/">From Surf Beach to Starlink</a>
        <span> — one launch, from the coast to orbit, and the bigger picture behind it</span>
      </div>
    </section>

    <section class="projects">
      <h2><a href="/history/?v=20261029" style="color: inherit;">Historical reads ↗</a></h2>
      <p><a href="/history/?v=20261029">Browse historical reads</a></p>
    </section>

  </main>
</body>
</html>
